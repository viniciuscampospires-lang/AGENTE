<style>
/* === DESIGN TOKENS
   Layout : sticky header → stats strip → scrollable table
   Palette: deep blue-black base / cyan accent / semantic green-red
   Type   : JetBrains Mono for data, Inter for chrome             */

:root {
  --bg        : #060a0e;
  --surface   : #0c1118;
  --surface2  : #111926;
  --border    : #182030;
  --border2   : #1e2a3e;
  --accent    : #00c8f0;
  --accent-glow: rgba(0,200,240,0.12);
  --purple    : #a78bfa;
  --purple-dim: rgba(167,139,250,0.14);
  --green     : #00e099;
  --green-dim : rgba(0,224,153,0.1);
  --red       : #ff2e55;
  --red-dim   : rgba(255,46,85,0.1);
  --yellow    : #ffc400;
  --text      : #c6d4ec;
  --text2     : #7a8aab;
  --muted     : #3e4e6e;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100% }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.4;
  padding-left : max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 200;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  flex-shrink: 0;
}
.logo svg { width: 28px; height: 28px; flex-shrink: 0 }
.logo-hi { color: var(--accent) }

.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--green-dim);
  border: 1px solid rgba(0,224,153,0.25);
  border-radius: 3px;
  padding: 3px 8px;
  font-size: 9px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--green);
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.spacer { flex: 1; min-width: 0 }

.filter-group {
  display: flex; gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 5px; padding: 3px;
}
.filter-btn {
  padding: 4px 11px; border-radius: 3px; border: none;
  background: transparent; color: var(--text2);
  font-size: 11px; font-weight: 600;
  font-family: 'Inter', sans-serif; cursor: pointer;
  transition: all .12s; white-space: nowrap;
}
.filter-btn:hover { color: var(--text) }
.filter-btn.active {
  background: var(--accent-glow); color: var(--accent);
  border: 1px solid rgba(0,200,240,.25);
}

/* sound button */
.sound-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 4px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer; transition: all .12s; white-space: nowrap;
}
.sound-btn:hover { color: var(--accent); border-color: rgba(0,200,240,.4) }
.sound-btn.on { color: var(--green); border-color: rgba(0,224,153,.35) }

/* refresh button */
.refresh-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 4px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer; transition: all .12s; white-space: nowrap;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent) }
.refresh-btn.spinning svg { animation: spin .7s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

/* ── STATS STRIP ── */
.stats-strip {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.stats-strip::-webkit-scrollbar { display: none }
.stat-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 7px 18px 7px 0;
  border-right: 1px solid var(--border);
  margin-right: 18px; min-width: max-content;
}
.stat-item:last-child { border-right: none }
.stat-label {
  font-size: 9px; font-weight: 600;
  letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted);
}
.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.stat-value.accent { color: var(--accent) }
.stat-value.green  { color: var(--green) }
.stat-value.red    { color: var(--red) }

/* source badges */
.src-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 6px; border-radius: 2px;
  font-size: 9px; font-weight: 700; letter-spacing: .3px;
  margin-right: 4px;
}
.src-ok  { background: var(--green-dim); color: var(--green) }
.src-err { background: var(--red-dim);   color: var(--red)   }
.src-ini { background: var(--surface2);  color: var(--muted) }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; padding-bottom: 40px }
.table-wrap::-webkit-scrollbar { height: 4px }
.table-wrap::-webkit-scrollbar-track { background: var(--surface) }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px }

table { width: 100%; min-width: 1020px; border-collapse: collapse }

thead th {
  padding: 6px 10px; text-align: left;
  font-size: 9px; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border);
  white-space: nowrap; cursor: pointer; user-select: none;
  background: var(--bg);
}
thead th:hover { color: var(--text2) }
thead th.sort-active { color: var(--accent) }
thead th .sa { margin-left: 3px; opacity: .7 }

tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .08s; cursor: pointer;
}
tbody tr:hover { background: var(--surface2) }

/* new pair flash */
tbody tr.flash-new { animation: rowFlash .9s ease forwards }
@keyframes rowFlash {
  0%   { background: rgba(0,200,240,.09) }
  100% { background: transparent }
}
/* whale flash (high liq) */
tbody tr.flash-whale { animation: whaleFlash 1.2s ease forwards }
@keyframes whaleFlash {
  0%   { background: rgba(255,196,0,.12) }
  100% { background: transparent }
}

td {
  padding: 7px 10px; vertical-align: middle;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

/* token */
.td-token { min-width: 0; max-width: 180px }
.tok-sym {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 12px; color: var(--text);
}
.tok-sep {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted); margin-left: 3px;
}
.tok-addr {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--muted);
}

/* badges */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 6px; border-radius: 3px;
  font-size: 9px; font-weight: 700;
  letter-spacing: .4px; text-transform: uppercase;
  font-family: 'Inter', sans-serif;
}
.b-dlmm  { background: var(--purple-dim); border: 1px solid rgba(167,139,250,.3); color: var(--purple) }
.b-dlmm2 { background: var(--accent-glow); border: 1px solid rgba(0,200,240,.3); color: var(--accent) }
.b-new   {
  background: rgba(255,196,0,.12); border: 1px solid rgba(255,196,0,.3);
  color: var(--yellow); margin-left: 4px; font-size: 8px;
}

td.price {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 500; color: var(--text);
}
td.pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600; text-align: right;
}
td.pct.up   { color: var(--green) }
td.pct.down { color: var(--red) }
td.pct.flat { color: var(--muted) }

td.txns {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; text-align: right;
}
.txb { color: var(--green) }
.txs { color: var(--red) }
.txd { color: var(--muted) }

td.vol, td.liq {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text2); text-align: right;
}
td.age {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; text-align: right;
}
td.age.fresh  { color: var(--yellow) }
td.age.recent { color: var(--text2) }
td.age.old    { color: var(--muted) }
td.num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--muted); text-align: right; width: 34px;
}

.link-row { display: flex; gap: 3px; align-items: center }
.ext-link {
  display: inline-flex; align-items: center;
  padding: 2px 6px; border-radius: 3px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--muted); font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  text-decoration: none; transition: all .1s; letter-spacing: .3px;
}
.ext-link:hover { color: var(--accent); border-color: rgba(0,200,240,.4) }

/* state rows */
.state-row td {
  text-align: center; padding: 52px 20px;
  color: var(--muted); font-family: 'Inter', sans-serif;
}
.si {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .65s linear infinite;
  vertical-align: -2px; margin-right: 8px;
}
.err-state { display: flex; flex-direction: column; align-items: center; gap: 10px }
.err-title { color: var(--red); font-size: 14px; font-weight: 600 }
.err-detail { color: var(--muted); font-size: 11px }
.err-sources { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }

/* scrollbar */
::-webkit-scrollbar       { width: 4px; height: 4px }
::-webkit-scrollbar-track { background: transparent }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px }
</style>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   SOUND ENGINE — Web Audio API, RocketScan style
   Needs a user gesture before AudioContext unlocks.
   ═══════════════════════════════════════════════════════════ */
const Sound = (() => {
  let ctx = null;
  let enabled = false;

  function init() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }

  function tone(freq, vol, start, dur) {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(vol, start + 0.018);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.start(start); osc.stop(start + dur + 0.01);
  }

  return {
    get enabled() { return enabled },
    toggle() { enabled = !enabled; if (enabled) init(); return enabled },
    enable()  { enabled = true; init() },

    // New token — 3-note ascending ping (high freq, short)
    newToken() {
      if (!enabled) return;
      init();
      const t = ctx.currentTime;
      tone(880,  0.18, t,        0.14);
      tone(1108, 0.18, t + 0.07, 0.14);
      tone(1320, 0.22, t + 0.14, 0.20);
    },

    // Whale alert — deeper, 4-note, slightly louder (liq > $100K)
    whale() {
      if (!enabled) return;
      init();
      const t = ctx.currentTime;
      tone(440, 0.28, t,        0.18);
      tone(554, 0.28, t + 0.09, 0.18);
      tone(659, 0.30, t + 0.18, 0.22);
      tone(880, 0.25, t + 0.30, 0.30);
    },
  };
})();

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
let allPairs   = [];        // normalized pair objects
let seenAddrs  = null;      // Set<string> — null = first load
let newCount   = 0;         // total new pairs detected this session
let filter     = 'all';
let sortKey    = 'age';
let sortDir    = -1;
let countdown  = 30;
let timerID    = null;

const srcStatus = { gt: 'ini', ds: 'ini' };

/* ═══════════════════════════════════════════════════════════
   FORMAT HELPERS
   ═══════════════════════════════════════════════════════════ */
function fmtPrice(p) {
  if (p == null || p === '') return '—';
  const n = +p; if (isNaN(n) || n === 0) return '—';
  if (n < 1e-6)  return '$' + n.toExponential(2);
  if (n < 0.001) return '$' + n.toFixed(7);
  if (n < 1)     return '$' + n.toFixed(5);
  if (n < 1000)  return '$' + n.toFixed(4);
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function fmtK(n) {
  if (n == null || isNaN(+n)) return '—';
  const v = +n;
  if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'K';
  return '$' + v.toFixed(0);
}

function fmtAge(ts) {
  if (!ts) return { text:'—', cls:'old' };
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 60)  return { text: m + 'm',             cls: m < 10 ? 'fresh' : 'recent' };
  const h = Math.floor(m / 60);
  if (h < 24)  return { text: h + 'h',             cls: 'recent' };
  return { text: Math.floor(h/24) + 'd',            cls: 'old' };
}

function fmtPct(v) {
  if (v == null || v === '') return { text:'—', cls:'flat' };
  const n = +v; if (isNaN(n)) return { text:'—', cls:'flat' };
  const cls  = n > 0.05 ? 'up' : n < -0.05 ? 'down' : 'flat';
  const sign = n > 0 ? '+' : '';
  return { text: sign + n.toFixed(2) + '%', cls };
}

function truncAddr(a) {
  if (!a) return ''; return a.slice(0,4) + '…' + a.slice(-4);
}

function dlmmVer(pair) {
  if ((pair.labels||[]).some(l => /v2/i.test(l)))        return 'dlmm2';
  if (/v2/i.test(pair.dexId||''))                         return 'dlmm2';
  return 'dlmm';
}

/* ═══════════════════════════════════════════════════════════
   DATA NORMALIZERS
   ═══════════════════════════════════════════════════════════ */

// GeckoTerminal pool → internal pair object
function normGT(pool, inclMap) {
  const a = pool.attributes || {};
  const baseId  = pool.relationships?.base_token?.data?.id  || '';
  const quoteId = pool.relationships?.quote_token?.data?.id || '';
  const dexId   = pool.relationships?.dex?.data?.id         || 'meteora_dlmm';

  const bt = inclMap[baseId]?.attributes  || {};
  const qt = inclMap[quoteId]?.attributes || {};
  const parts = (a.name || '').split(' / ');

  const txH1 = a.transactions?.h1 || {};

  return {
    pairAddress : a.address,
    baseToken   : {
      symbol  : bt.symbol  || parts[0] || '?',
      address : bt.address || baseId.replace('solana_', ''),
      name    : bt.name    || '',
    },
    quoteToken  : {
      symbol  : qt.symbol  || parts[1] || 'SOL',
      address : qt.address || quoteId.replace('solana_', ''),
    },
    dexId        : dexId,
    chainId      : 'solana',
    priceUsd     : a.base_token_price_usd,
    priceChange  : {
      m5 : parseFloat(a.price_change_percentage?.m5  || 0),
      h1 : parseFloat(a.price_change_percentage?.h1  || 0),
      h6 : parseFloat(a.price_change_percentage?.h6  || 0),
      h24: parseFloat(a.price_change_percentage?.h24 || 0),
    },
    volume      : { h24: parseFloat(a.volume_usd?.h24   || 0) },
    liquidity   : { usd: parseFloat(a.reserve_in_usd    || 0) },
    txns        : { buys: txH1.buys||0, sells: txH1.sells||0 },
    pairCreatedAt: a.pool_created_at ? +new Date(a.pool_created_at) : null,
    url         : `https://dexscreener.com/solana/${a.address}`,
    labels      : dexId.includes('v2') ? ['DLMM v2'] : [],
    _src        : 'gt',
  };
}

// DexScreener pair → internal pair object
function normDS(p) {
  return {
    pairAddress : p.pairAddress,
    baseToken   : p.baseToken  || {},
    quoteToken  : p.quoteToken || {},
    dexId       : p.dexId,
    chainId     : p.chainId,
    priceUsd    : p.priceUsd,
    priceChange : p.priceChange || {},
    volume      : p.volume      || {},
    liquidity   : p.liquidity   || {},
    txns        : { buys: p.txns?.h1?.buys||0, sells: p.txns?.h1?.sells||0 },
    pairCreatedAt: p.pairCreatedAt || null,
    url         : p.url || `https://dexscreener.com/solana/${p.pairAddress}`,
    labels      : p.labels || [],
    _src        : 'ds',
  };
}

/* ═══════════════════════════════════════════════════════════
   FETCHERS
   ═══════════════════════════════════════════════════════════ */

// AbortController com timeout compatível com todos os ambientes
function makeSignal(ms) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  ctrl.signal.addEventListener('abort', () => clearTimeout(id), { once: true });
  return ctrl.signal;
}

async function safeFetch(url) {
  const r = await fetch(url, { signal: makeSignal(8000) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Processa um endpoint GeckoTerminal e adiciona ao Map
async function gtEndpoint(url, results) {
  try {
    const d = await safeFetch(url);
    const inclMap = {};
    (d.included || []).forEach(i => { inclMap[i.id] = i });
    (d.data || []).forEach(pool => {
      if (pool.attributes?.address) {
        const p = normGT(pool, inclMap);
        if (!results.has(p.pairAddress)) results.set(p.pairAddress, p);
      }
    });
  } catch (_) {}
}

// GeckoTerminal: requests paralelos para todos os dex IDs Meteora
async function fetchGeckoTerminal() {
  const DEXES = ['meteora_dlmm', 'meteora_dlmm_v2', 'meteora'];
  const results = new Map();

  const tasks = DEXES.flatMap(dex => [
    gtEndpoint(
      `https://api.geckoterminal.com/api/v2/networks/solana/new_pools?dex=${dex}&include=base_token,quote_token,dex`,
      results
    ),
    gtEndpoint(
      `https://api.geckoterminal.com/api/v2/networks/solana/dexes/${dex}/pools?sort=pool_created_at_desc&include=base_token,quote_token,dex&page=1`,
      results
    ),
  ]);

  await Promise.allSettled(tasks);
  return [...results.values()];
}

// DexScreener: token profiles + direct search
async function fetchDexScreener() {
  const results = new Map();

  // 1) Latest token profiles → fetch their Solana pairs → filter Meteora
  try {
    const profiles = await safeFetch('https://api.dexscreener.com/token-profiles/latest/v1');
    const addrs = (Array.isArray(profiles) ? profiles : [])
      .filter(p => p.chainId === 'solana')
      .slice(0, 30).map(p => p.tokenAddress).filter(Boolean);

    if (addrs.length) {
      try {
        const d2 = await safeFetch(`https://api.dexscreener.com/latest/dex/tokens/${addrs.join(',')}`);
        (d2.pairs||[])
          .filter(p => p.dexId?.toLowerCase().includes('meteora') && p.chainId==='solana')
          .forEach(p => results.set(p.pairAddress, normDS(p)));
      } catch (_) {}
    }
  } catch (_) {}

  // 2) Direct search for "meteora"
  try {
    const d3 = await safeFetch('https://api.dexscreener.com/latest/dex/search?q=meteora');
    (d3.pairs||[])
      .filter(p => p.dexId?.toLowerCase().includes('meteora') && p.chainId==='solana')
      .forEach(p => { if (!results.has(p.pairAddress)) results.set(p.pairAddress, normDS(p)) });
  } catch (_) {}

  return [...results.values()];
}

/* ═══════════════════════════════════════════════════════════
   MAIN FETCH — parallel, merge by pairAddress (GT wins)
   ═══════════════════════════════════════════════════════════ */
async function fetchAll() {
  const [gtPairs, dsPairs] = await Promise.allSettled([
    fetchGeckoTerminal(),
    fetchDexScreener(),
  ]).then(res => res.map(r => r.status === 'fulfilled' ? r.value : []));

  // Source status
  srcStatus.gt = gtPairs.length > 0 ? 'ok' : 'err';
  srcStatus.ds = dsPairs.length > 0 ? 'ok' : 'err';

  // Merge: GT is authoritative, DS fills gaps
  const merged = new Map();
  dsPairs.forEach(p => merged.set(p.pairAddress, p));
  gtPairs.forEach(p => merged.set(p.pairAddress, p));   // GT overwrites

  return [...merged.values()];
}

/* ═══════════════════════════════════════════════════════════
   SORT + FILTER
   ═══════════════════════════════════════════════════════════ */
function sortPairs(pairs) {
  return [...pairs].sort((a, b) => {
    let av, bv;
    switch (sortKey) {
      case 'symbol': return sortDir * (a.baseToken.symbol||'').localeCompare(b.baseToken.symbol||'');
      case 'price' : av=+(a.priceUsd||0);                bv=+(b.priceUsd||0);               break;
      case 'm5'    : av=+(a.priceChange?.m5||0);          bv=+(b.priceChange?.m5||0);        break;
      case 'h1'    : av=+(a.priceChange?.h1||0);          bv=+(b.priceChange?.h1||0);        break;
      case 'h6'    : av=+(a.priceChange?.h6||0);          bv=+(b.priceChange?.h6||0);        break;
      case 'h24'   : av=+(a.priceChange?.h24||0);         bv=+(b.priceChange?.h24||0);       break;
      case 'txns'  : av=(a.txns?.buys||0)+(a.txns?.sells||0); bv=(b.txns?.buys||0)+(b.txns?.sells||0); break;
      case 'vol'   : av=+(a.volume?.h24||0);              bv=+(b.volume?.h24||0);            break;
      case 'liq'   : av=+(a.liquidity?.usd||0);           bv=+(b.liquidity?.usd||0);         break;
      case 'age'   : av=+(a.pairCreatedAt||0);            bv=+(b.pairCreatedAt||0);          break;
      default      : av=0; bv=0;
    }
    return sortDir * (bv - av);
  });
}

function visible() {
  let p = allPairs;
  if (filter === 'dlmm')  p = p.filter(x => dlmmVer(x) === 'dlmm');
  if (filter === 'dlmm2') p = p.filter(x => dlmmVer(x) === 'dlmm2');
  return sortPairs(p);
}

/* ═══════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════ */
function renderStats(newAddrs) {
  const dlmm  = allPairs.filter(p => dlmmVer(p) === 'dlmm').length;
  const dlmm2 = allPairs.filter(p => dlmmVer(p) === 'dlmm2').length;
  const vol   = allPairs.reduce((s, p) => s + (+(p.volume?.h24)||0), 0);
  const liq   = allPairs.reduce((s, p) => s + (+(p.liquidity?.usd)||0), 0);

  document.getElementById('sPairs').textContent  = allPairs.length;
  document.getElementById('sDlmm').textContent   = dlmm;
  document.getElementById('sDlmm2').textContent  = dlmm2;
  document.getElementById('sNew').textContent    = newCount;
  document.getElementById('sVol').textContent    = fmtK(vol);
  document.getElementById('sLiq').textContent    = fmtK(liq);
  document.getElementById('sTime').textContent   = new Date().toLocaleTimeString('pt-BR');

  const gtEl = document.getElementById('srcGT');
  const dsEl = document.getElementById('srcDS');
  gtEl.textContent = 'GT ' + (srcStatus.gt === 'ok' ? '✓' : srcStatus.gt === 'err' ? '✗' : '—');
  gtEl.className   = 'src-badge ' + (srcStatus.gt === 'ok' ? 'src-ok' : srcStatus.gt === 'err' ? 'src-err' : 'src-ini');
  dsEl.textContent = 'DS ' + (srcStatus.ds === 'ok' ? '✓' : srcStatus.ds === 'err' ? '✗' : '—');
  dsEl.className   = 'src-badge ' + (srcStatus.ds === 'ok' ? 'src-ok' : srcStatus.ds === 'err' ? 'src-err' : 'src-ini');
}

function renderTable(newAddrs) {
  const pairs = visible();
  const tbody = document.getElementById('tbody');

  if (!pairs.length) {
    // Se allPairs também está vazio, exibe estado de erro real
    if (!allPairs.length) return;  // showError() já cuida disso
    tbody.innerHTML = `<tr class="state-row"><td colspan="13">
      <div class="err-state">
        <div class="err-title" style="color:var(--muted)">Nenhum par neste filtro</div>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = pairs.map((pair, i) => {
    const ver  = dlmmVer(pair);
    const base = pair.baseToken || {};
    const pc   = pair.priceChange || {};
    const m5   = fmtPct(pc.m5);
    const h1   = fmtPct(pc.h1);
    const h6   = fmtPct(pc.h6);
    const h24  = fmtPct(pc.h24);
    const age  = fmtAge(pair.pairCreatedAt);
    const isNew = newAddrs?.has(pair.pairAddress);
    const liq  = +(pair.liquidity?.usd||0);
    const cls  = isNew ? (liq >= 100000 ? ' flash-whale' : ' flash-new') : '';

    const badge = ver === 'dlmm2'
      ? '<span class="badge b-dlmm2">DLMM v2</span>'
      : '<span class="badge b-dlmm">DLMM</span>';

    const newTag = isNew ? '<span class="badge b-new">NOVO</span>' : '';

    const buys  = pair.txns?.buys  || 0;
    const sells = pair.txns?.sells || 0;
    const txHtml = (buys || sells)
      ? `<span class="txb">${buys}B</span><span class="txd"> / </span><span class="txs">${sells}S</span>`
      : '<span class="txd">—</span>';

    const dexUrl = pair.url || `https://dexscreener.com/solana/${pair.pairAddress}`;
    const beUrl  = `https://birdeye.so/token/${base.address}?chain=solana`;
    const scUrl  = `https://solscan.io/account/${pair.pairAddress}`;

    return `<tr class="${cls}" onclick="window.open('${dexUrl}','_blank')">
      <td class="num">${i+1}</td>
      <td class="td-token">
        <div style="display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;align-items:baseline">
            <span class="tok-sym">${base.symbol||'?'}</span>
            <span class="tok-sep">/${pair.quoteToken?.symbol||'SOL'}</span>
            ${newTag}
          </div>
          <div class="tok-addr">${truncAddr(base.address)}</div>
        </div>
      </td>
      <td>${badge}</td>
      <td class="price">${fmtPrice(pair.priceUsd)}</td>
      <td class="pct ${m5.cls}">${m5.text}</td>
      <td class="pct ${h1.cls}">${h1.text}</td>
      <td class="pct ${h6.cls}">${h6.text}</td>
      <td class="pct ${h24.cls}">${h24.text}</td>
      <td class="txns">${txHtml}</td>
      <td class="vol">${fmtK(pair.volume?.h24)}</td>
      <td class="liq">${fmtK(pair.liquidity?.usd)}</td>
      <td class="age ${age.cls}">${age.text}</td>
      <td onclick="event.stopPropagation()">
        <div class="link-row">
          <a href="${dexUrl}" target="_blank" class="ext-link">DS</a>
          <a href="${beUrl}"  target="_blank" class="ext-link">BE</a>
          <a href="${scUrl}"  target="_blank" class="ext-link">SC</a>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function showError(msgs) {
  document.getElementById('tbody').innerHTML = `<tr class="state-row"><td colspan="13">
    <div class="err-state">
      <div class="err-title">⚠ Nenhum dado retornado pelas APIs</div>
      <div class="err-detail">${msgs.join(' · ')}</div>
      <div class="err-sources">
        <span>GeckoTerminal: ${srcStatus.gt}</span>
        <span>DexScreener: ${srcStatus.ds}</span>
      </div>
      <div class="err-detail" style="color:var(--muted);margin-top:4px">
        Verifique a conexão. O sistema tentará novamente automaticamente.
      </div>
    </div>
  </td></tr>`;
}

/* ═══════════════════════════════════════════════════════════
   LOAD CYCLE
   ═══════════════════════════════════════════════════════════ */
function startTimer() {
  clearInterval(timerID);
  countdown = 30;
  document.getElementById('timerLabel').textContent = '30s';
  timerID = setInterval(() => {
    countdown--;
    document.getElementById('timerLabel').textContent = countdown + 's';
    if (countdown <= 0) load();
  }, 1000);
}

async function load() {
  clearInterval(timerID);
  document.getElementById('timerLabel').textContent = '…';
  document.getElementById('refreshBtn').classList.add('spinning');

  let pairs;
  try {
    pairs = await fetchAll();
  } catch (e) {
    pairs = [];
  }

  if (!pairs.length) {
    showError([
      'GeckoTerminal: ' + (srcStatus.gt === 'ok' ? 'OK' : 'sem resposta'),
      'DexScreener: '   + (srcStatus.ds === 'ok' ? 'OK' : 'sem resposta'),
    ]);
    document.getElementById('refreshBtn').classList.remove('spinning');
    startTimer();
    return;
  }

  // Detect new pairs
  let newAddrs = null;
  if (seenAddrs === null) {
    // First load — populate seen without alerting
    seenAddrs = new Set(pairs.map(p => p.pairAddress));
  } else {
    newAddrs = new Set();
    let maxLiq = 0;
    for (const p of pairs) {
      if (!seenAddrs.has(p.pairAddress)) {
        newAddrs.add(p.pairAddress);
        seenAddrs.add(p.pairAddress);
        newCount++;
        const liq = +(p.liquidity?.usd||0);
        if (liq > maxLiq) maxLiq = liq;
      }
    }
    if (newAddrs.size > 0) {
      if (maxLiq >= 100000) Sound.whale();
      else                  Sound.newToken();
    }
  }

  allPairs = pairs;
  renderStats(newAddrs);
  renderTable(newAddrs);

  document.getElementById('refreshBtn').classList.remove('spinning');
  startTimer();
}

/* ═══════════════════════════════════════════════════════════
   SOUND TOGGLE
   ═══════════════════════════════════════════════════════════ */
document.getElementById('soundBtn').addEventListener('click', function() {
  const on = Sound.toggle();
  document.getElementById('soundLabel').textContent = on ? 'SOM ON' : 'SOM OFF';
  this.classList.toggle('on', on);
  if (on) Sound.newToken();  // preview sound when enabling
});

/* ═══════════════════════════════════════════════════════════
   SORT HEADERS
   ═══════════════════════════════════════════════════════════ */
document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    sortDir = (sortKey === key) ? sortDir * -1 : -1;
    sortKey = key;
    document.querySelectorAll('thead th').forEach(t => {
      t.classList.remove('sort-active');
      t.querySelector('.sa')?.remove();
    });
    th.classList.add('sort-active');
    const arrow = document.createElement('span');
    arrow.className = 'sa';
    arrow.textContent = sortDir === -1 ? '↓' : '↑';
    th.appendChild(arrow);
    renderTable(null);
  });
});

/* ═══════════════════════════════════════════════════════════
   FILTER BUTTONS
   ═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    renderTable(null);
  });
});

/* ═══════════════════════════════════════════════════════════
   MANUAL REFRESH
   ═══════════════════════════════════════════════════════════ */
document.getElementById('refreshBtn').addEventListener('click', () => load());

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
load();
</script>
